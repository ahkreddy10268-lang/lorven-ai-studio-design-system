<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button · Lorven AI Studio</title>
<link rel="stylesheet" href="../../tokens/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;padding:24px;background:var(--bg-canvas);color:var(--text-primary)}
.ds-stack{display:flex;flex-direction:column;gap:24px}.ds-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.ds-label{font:600 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.ds-pair{display:grid;grid-template-columns:1fr 1fr;gap:0}.ds-pair>*{padding:16px;background:var(--bg-canvas)}
.theme-bar{position:fixed;top:12px;right:12px;z-index:100}.theme-bar button{font:500 12px var(--font-sans);padding:6px 10px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-control);color:var(--text-primary);cursor:pointer}</style></head>
<body><div class="theme-bar"><button onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Toggle theme</button></div>
<div class="ds-stack"><div data-theme="dark"><div class="ds-label">Variants</div>
<div class="ds-row"><button class="l-btn l-btn--primary"><span data-icon="aperture" data-size="16"></span>Generate</button><button class="l-btn l-btn--secondary"><span data-icon="comment" data-size="16"></span>Comment</button><button class="l-btn l-btn--outline">Choose frames</button><button class="l-btn l-btn--ghost"><span data-icon="filter" data-size="16"></span>Filter</button><button class="l-btn l-btn--tertiary">View source</button><button class="l-btn l-btn--destructive">Discard draft</button><button class="l-btn l-btn--icon" aria-label="More actions"><span data-icon="more" data-size="20"></span></button></div>
<div class="ds-label">Primary states</div>
<div class="ds-row"><button class="l-btn l-btn--primary">Default</button><button class="l-btn l-btn--primary is-hover">Hover</button><button class="l-btn l-btn--primary is-pressed">Pressed</button><button class="l-btn l-btn--primary is-focus">Focus</button><button class="l-btn l-btn--primary" disabled>Disabled</button><button class="l-btn l-btn--primary" aria-busy="true"><span data-icon="loading" data-size="16"></span>Exporting…</button></div>
<div class="ds-label">Secondary · outline · ghost states</div>
<div class="ds-row"><button class="l-btn l-btn--secondary is-hover">Hover</button><button class="l-btn l-btn--secondary is-focus">Focus</button><button class="l-btn l-btn--outline is-hover">Hover</button><button class="l-btn l-btn--outline is-pressed">Pressed</button><button class="l-btn l-btn--ghost is-hover">Hover</button><button class="l-btn l-btn--outline" disabled>Disabled</button></div>
<div class="ds-label">Sizes</div>
<div class="ds-row"><button class="l-btn l-btn--secondary l-btn--sm"><span data-icon="filter" data-size="16"></span>Small</button><button class="l-btn l-btn--secondary"><span data-icon="export" data-size="16"></span>Medium</button><button class="l-btn l-btn--primary l-btn--lg">Open in Cine Sketch<span data-icon="chevron-right" data-size="20"></span></button><button class="l-btn l-btn--icon l-btn--sm" aria-label="Close"><span data-icon="close" data-size="16"></span></button></div></div><div data-theme="light"><div class="ds-label">Variants</div>
<div class="ds-row"><button class="l-btn l-btn--primary"><span data-icon="aperture" data-size="16"></span>Generate</button><button class="l-btn l-btn--secondary"><span data-icon="comment" data-size="16"></span>Comment</button><button class="l-btn l-btn--outline">Choose frames</button><button class="l-btn l-btn--ghost"><span data-icon="filter" data-size="16"></span>Filter</button><button class="l-btn l-btn--tertiary">View source</button><button class="l-btn l-btn--destructive">Discard draft</button><button class="l-btn l-btn--icon" aria-label="More actions"><span data-icon="more" data-size="20"></span></button></div>
<div class="ds-label">Primary states</div>
<div class="ds-row"><button class="l-btn l-btn--primary">Default</button><button class="l-btn l-btn--primary is-hover">Hover</button><button class="l-btn l-btn--primary is-pressed">Pressed</button><button class="l-btn l-btn--primary is-focus">Focus</button><button class="l-btn l-btn--primary" disabled>Disabled</button><button class="l-btn l-btn--primary" aria-busy="true"><span data-icon="loading" data-size="16"></span>Exporting…</button></div>
<div class="ds-label">Secondary · outline · ghost states</div>
<div class="ds-row"><button class="l-btn l-btn--secondary is-hover">Hover</button><button class="l-btn l-btn--secondary is-focus">Focus</button><button class="l-btn l-btn--outline is-hover">Hover</button><button class="l-btn l-btn--outline is-pressed">Pressed</button><button class="l-btn l-btn--ghost is-hover">Hover</button><button class="l-btn l-btn--outline" disabled>Disabled</button></div>
<div class="ds-label">Sizes</div>
<div class="ds-row"><button class="l-btn l-btn--secondary l-btn--sm"><span data-icon="filter" data-size="16"></span>Small</button><button class="l-btn l-btn--secondary"><span data-icon="export" data-size="16"></span>Medium</button><button class="l-btn l-btn--primary l-btn--lg">Open in Cine Sketch<span data-icon="chevron-right" data-size="20"></span></button><button class="l-btn l-btn--icon l-btn--sm" aria-label="Close"><span data-icon="close" data-size="16"></span></button></div></div></div>
<script>window.Lorven&&Lorven.hydrate();</script>

<script src="../bundle.js"></script></body></html>
